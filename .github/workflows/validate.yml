name: Validate skill package

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install repository checks
        run: uv sync --locked
      - name: Validate documentation and package invariants
        run: uv run --locked python scripts/validate.py
      - name: Exercise validator and archive protections
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build and validate extracted archive
        run: uv run --locked python scripts/package.py
